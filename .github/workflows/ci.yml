# v3 Phase 7. Unit tests on Ubuntu and Windows, e2e on Ubuntu, a check that the
# generated files are up to date, and on a `v*` tag the release: version check,
# exe build, exe smoke test, and a GitHub release made with the workflow's own
# GITHUB_TOKEN, with the notes from CHANGELOG.md. No credential is ever read or
# extracted.
name: CI

on:
  push:
    branches: [main, 'v3/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:copy
      - run: node scripts/check-version.js
      - name: Discover eval on the committed fixture
        run: node scripts/eval-discover.js --assert

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  generated:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/generate-themes.js
      - run: node scripts/generate-font-manifest.js
      - run: node scripts/generate-discover-fixture.js
      - name: No diff after regenerating
        run: git diff --exit-code --stat

  release:
    name: Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, e2e, generated]
    runs-on: windows-latest
    permissions:
      contents: write
    # The tag reaches the commands only as an environment variable, never pasted
    # into a command line.
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: version.json matches the tag
        shell: bash
        run: node scripts/check-version.js "$TAG"
      - run: node scripts/build-exe.js
      - run: node scripts/smoke-exe.js
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: node scripts/release-notes.js "$TAG" > release-notes.md
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" dist/AnimeTracker.exe --title "Anime Tracker $TAG" --notes-file release-notes.md --verify-tag
